[project]
name = "phonon"
version = "0.1.0"
description = "Local OpenAI-compatible speech-to-text server for Phonon-2"
requires-python = ">=3.12"
dependencies = [
    # [mlx] only resolves on Apple Silicon; everywhere else runs the CPU engine
    "fermion-research[mlx]>=0.2.11",
    # mlx-audio < 0.5 crashes Phonon-2 --hotwords ('ParakeetTDT' has no 'blank_id')
    "mlx-audio>=0.5.8; sys_platform == 'darwin' and platform_machine == 'arm64'",
    # Direct dep so the CPU index below applies (Windows / Linux)
    "torch; sys_platform != 'darwin'",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }
